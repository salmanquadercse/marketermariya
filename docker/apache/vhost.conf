<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # FollowSymLinks is required for RewriteEngine inside .htaccess.
        Options -Indexes +FollowSymLinks
        # Let public/.htaccess (Laravel's front-controller rewrite rules) take effect.
        AllowOverride All
        Require all granted
    </Directory>

    # The official image symlinks these to stdout/stderr, so `docker compose logs app` shows them.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
