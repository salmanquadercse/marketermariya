; Laravel-specific overrides layered on top of php.ini-development.

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M

; OPcache: on, but revalidate files on every request so edits show up immediately (dev setting).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; Timezone: keep PHP and Laravel (config/app.php) in agreement.
date.timezone = UTC
